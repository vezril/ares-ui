apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ares-ui.fullname" . }}
  labels:
    {{- include "ares-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ares-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ares-ui.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ares-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # Server-tier copy only — the browser's value is baked at build time.
            - name: NEXT_PUBLIC_ARES_API_BASE
              value: {{ .Values.apiBase | quote }}
            - name: ARES_ENDPOINT
              value: {{ .Values.ares.endpoint | quote }}
            {{- if .Values.ares.liveStream }}
            - name: ARES_LIVE_STREAM
              value: "1"
            {{- end }}
          # Probe the app's own root, not a BFF route: an upstream outage must
          # not restart this pod. The console is designed to render a reachable
          # error state when Ares is down — killing it instead would remove
          # the one surface that explains the outage.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
